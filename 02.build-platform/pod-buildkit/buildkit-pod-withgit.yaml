apiVersion: v1
kind: Pod
metadata:
  name: skala-buildkit-pod
  namespace: class-0
  labels:
    app: skala
spec:
  # Init Container: Maven 
  initContainers:
  - name: maven
    image: maven:3.9-eclipse-temurin-21
    workingDir: /workspace
    command: ["/bin/bash"]
    args:
      - -c
      - |
        echo "=== Git Clone 시작 ==="
        git clone https://himang10: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@github.com/himang10/myfirst-api-server.git .
        echo "=== Maven 빌드 시작 ==="
        mvn clean install -DskipTests
        echo "=== 빌드 완료 ==="
        ls -al

    volumeMounts:
      - name: workspace
        mountPath: /workspace

  # Main Container: BuildKit
  containers:
  - name: buildkit
    image: moby/buildkit:rootless
    command: ["buildctl-daemonless.sh"]
    args:
      - build
      - --frontend=dockerfile.v0
      - --local=context=/workspace
      - --local=dockerfile=/workspace
      - --opt=platform=linux/arm64,linux/amd64
      - --output=type=image,name=skala-registry.skala-ai.com/class-0/skala-webserver:1.0.buildkit-pod,push=true
    env:
      - name: DOCKER_CONFIG
        value: /home/user/.docker
      - name: BUILDKITD_FLAGS
        value: --oci-worker-no-process-sandbox
    # rootless BuildKit의 user namespace 작업에 필요
    securityContext:
      seccompProfile:
        type: Unconfined
    volumeMounts:
      - name: workspace
        mountPath: /workspace
      - name: buildkit-secret
        mountPath: /home/user/.docker
        readOnly: true

  restartPolicy: Never
  volumes:
    - name: workspace
      emptyDir: {}
    - name: buildkit-secret
      secret:
        secretName: harbor-registry-secret
        items:
          - key: .dockerconfigjson
            path: config.json
