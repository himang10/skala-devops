{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "springboot.appName" . }}
  namespace: {{ .Values.global.namespace }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  rules:
  - host: {{ include "springboot.userPrefix" . }}-ingress.{{ .Values.global.springboot.ingress.baseDomain }}
    http:
      paths:
      - backend:
          service:
            name: {{ include "springboot.appName" . }}
            port:
              number: {{ .Values.springboot.service.port }}
        path: /api
        pathType: Prefix
  tls:
  - hosts:
    - {{ printf "%s-ingress.%s" (include "springboot.userPrefix" .) .Values.global.springboot.ingress.baseDomain | quote }}
    secretName: wildcard-{{ .Values.global.namespace }}-skala-{{ .Values.global.location }}-com-tls
{{- end }}
