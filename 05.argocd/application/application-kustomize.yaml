apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skala-myapp-kustomize
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    namespace: class-0
    server: https://kubernetes.default.svc
  project: class-0
  source:
    path: kustomize/overlays/dev
    repoURL: https://github.com/himang10/myfirst-api-server.git
    targetRevision: gitops        # 예: HEAD, main, gitops 등
    kustomize: {}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PrunePropagationPolicy=background
